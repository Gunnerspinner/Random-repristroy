<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --glass-bg: rgba(18, 18, 32, 0.55);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-blur: blur(20px);
            --text-main: #f3f4f6;
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-glow: 0 0 25px rgba(168, 85, 247, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #030308;
            color: var(--text-main);
        }

        /* --- Canvas Cosmic Background --- */
        #cosmic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 30%, #170a38 0%, #030308 85%);
        }

        /* --- Glassmorphic Base --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* --- Sci-Fi Boot Screen --- */
        #boot-screen {
            position: fixed;
            inset: 0;
            background: #020205;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .boot-logo-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: var(--accent-glow);
            animation: bootPulse 2s infinite alternate;
        }

        @keyframes bootPulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }
            100% { transform: scale(1.08); box-shadow: 0 0 35px rgba(6, 182, 212, 0.6); }
        }

        /* --- Desktop Container --- */
        #desktop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - 54px);
            z-index: 10;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 96px);
            grid-auto-rows: 96px;
            gap: 16px;
            align-content: start;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }

        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: var(--glass-blur);
            border-color: var(--glass-border);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .desktop-icon .icon-img {
            font-size: 36px;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .desktop-icon .icon-label {
            font-size: 11px;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 80px;
            text-align: center;
        }

        /* --- Taskbar --- */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 54px;
            background: rgba(10, 10, 22, 0.7);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 99990;
        }

        /* --- Start Menu --- */
        #start-menu {
            position: fixed;
            bottom: 64px;
            left: 16px;
            width: 320px;
            border-radius: 20px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 99995;
            animation: slideUp 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Window Management --- */
        .window {
            position: absolute;
            top: 70px;
            left: 100px;
            width: 780px;
            height: 520px;
            min-width: 320px;
            min-height: 240px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 20;
            resize: both;
        }

        .window.minimized {
            display: none !important;
        }

        .window-header {
            height: 42px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            cursor: move;
        }

        .window-body {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            background: rgba(12, 12, 24, 0.6);
        }

        /* --- App Specific UI --- */
        /* Custom Browser Tabs */
        .tab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 5px 12px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            max-width: 180px;
            min-width: 100px;
            justify-content: space-between;
            color: rgba(255,255,255,0.7);
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: rgba(168, 85, 247, 0.2);
            color: white;
            border-color: rgba(168, 85, 247, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

    <!-- Sci-Fi Boot Screen -->
    <div id="boot-screen">
        <div class="flex flex-col items-center gap-6 w-80">
            <div class="boot-logo-wrapper">
                <span class="text-4xl">🪐</span>
            </div>
            <div class="text-2xl font-bold tracking-widest bg-gradient-to-r from-purple-400 via-cyan-400 to-blue-500 bg-clip-text text-transparent">
                COSMIC OS
            </div>
            <div class="w-full flex flex-col gap-2">
                <div class="w-full h-1.5 bg-gray-900 rounded-full overflow-hidden border border-white/10">
                    <div id="boot-bar" class="h-full w-0 bg-gradient-to-r from-purple-500 to-cyan-400 shadow-[0_0_12px_#a855f7] transition-all duration-300 ease-out"></div>
                </div>
                <div id="boot-status" class="text-xs font-mono text-gray-400 text-center h-4">Initializing kernel...</div>
            </div>
        </div>
    </div>

    <!-- Animated Cosmic Space Background -->
    <div id="cosmic-bg">
        <canvas id="spaceCanvas"></canvas>
    </div>

    <!-- Main Desktop Surface -->
    <div id="desktop" ondragover="event.preventDefault()" ondrop="handleDesktopDrop(event)"></div>

    <!-- Start Menu Popup -->
    <div id="start-menu" class="glass-panel p-4">
        <div class="flex items-center gap-3 p-2 mb-3 border-b border-white/10">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-600 to-cyan-400 flex items-center justify-center font-bold text-lg shadow-md">
                C
            </div>
            <div>
                <div class="text-sm font-semibold">Cosmic User</div>
                <div class="text-xs text-cyan-400">Primary Node Admin</div>
            </div>
        </div>
        <div class="text-xs font-semibold text-gray-400 mb-2 px-2">SYSTEM APPLICATIONS</div>
        <div class="flex flex-col gap-1 max-h-60 overflow-y-auto pr-1" id="start-app-list"></div>
        <div class="mt-4 pt-2 border-t border-white/10 flex justify-between gap-2">
            <button onclick="toggleFullscreen()" class="flex-1 text-xs py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition">
                📺 Fullscreen
            </button>
            <button onclick="rebootSystem()" class="flex-1 text-xs py-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/30 transition">
                🔄 Reboot
            </button>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <div class="flex items-center gap-3">
            <button onclick="toggleStartMenu()" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-gradient-to-r from-purple-600/40 to-blue-600/40 border border-white/15 hover:border-purple-400/60 transition shadow-lg text-xs font-semibold">
                <span>🪐</span>
                <span>Cosmic</span>
            </button>
            <div id="taskbar-apps" class="flex items-center gap-2"></div>
        </div>
        <div class="flex items-center gap-4 text-xs">
            <button onclick="toggleFullscreen()" class="p-1.5 hover:bg-white/10 rounded-lg text-gray-300 transition" title="Toggle Desktop Fullscreen">
                📺
            </button>
            <div id="p2p-node-badge" class="px-2.5 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 text-[11px] font-mono" title="P2P Mesh Network Status">
                P2P: Scanning
            </div>
            <div id="clock" class="font-medium text-gray-200">00:00 AM</div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. COSMIC SPACE CANVAS ANIMATION ENGINE
           ========================================================================== */
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.speedY = (Math.random() - 0.5) * 0.2;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.color = Math.random() > 0.5 ? '#a855f7' : '#06b6d4';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset();
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 220; i++) particles.push(new Particle());

        function animateSpace() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Subtle Nebula Clouds
            const gradient = ctx.createRadialGradient(width * 0.7, height * 0.3, 20, width * 0.7, height * 0.3, width * 0.5);
            gradient.addColorStop(0, 'rgba(168, 85, 247, 0.12)');
            gradient.addColorStop(0.6, 'rgba(6, 182, 212, 0.05)');
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.globalAlpha = 1.0;
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateSpace);
        }
        animateSpace();

        /* ==========================================================================
           2. BOOT SEQUENCE & TIME SYSTEM
           ========================================================================== */
        const bootSteps = [
            { pct: 20, text: "Mounting Virtual VFS Storage..." },
            { pct: 45, text: "Spawning Glassmorphic Compositor..." },
            { pct: 75, text: "Handshaking P2P Mesh Access Point..." },
            { pct: 100, text: "System Online." }
        ];
        let bootIdx = 0;
        function runBoot() {
            if (bootIdx < bootSteps.length) {
                document.getElementById('boot-bar').style.width = bootSteps[bootIdx].pct + '%';
                document.getElementById('boot-status').innerText = bootSteps[bootIdx].text;
                bootIdx++;
                setTimeout(runBoot, 300);
            } else {
                setTimeout(() => {
                    const bs = document.getElementById('boot-screen');
                    bs.style.opacity = '0';
                    setTimeout(() => bs.remove(), 800);
                }, 400);
            }
        }
        window.addEventListener('load', runBoot);

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(()=>{});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function rebootSystem() {
            location.reload();
        }

        /* ==========================================================================
           3. VIRTUAL FILE SYSTEM (VFS)
           ========================================================================== */
        const defaultVFS = {
            "Documents": {
                "Welcome.txt": "Welcome to Cosmic OS!\n\nA complete Web Desktop environment equipped with Glassmorphic UI, P2P mesh chatting, tabbed browser proxy, app uploader, and built-in apps.",
                "Project_Notes.txt": "1. Build P2P network.\n2. Add multi-tab browser fallback.\n3. Enable direct app uploading."
            },
            "Downloads": {},
            "Pictures": {},
            "Apps": {}
        };

        if (!localStorage.getItem('cosmic_vfs')) {
            localStorage.setItem('cosmic_vfs', JSON.stringify(defaultVFS));
        }

        function getVFS() {
            return JSON.parse(localStorage.getItem('cosmic_vfs') || '{}');
        }

        function saveVFS(vfs) {
            localStorage.setItem('cosmic_vfs', JSON.stringify(vfs));
        }

        /* ==========================================================================
           4. WINDOW MANAGER ENGINE
           ========================================================================== */
        let openWindows = {};
        let zIndexCounter = 100;

        function createWindow({ id, title, icon, contentHTML, width = 780, height = 520 }) {
            if (openWindows[id]) {
                bringToFront(id);
                if (openWindows[id].classList.contains('minimized')) {
                    openWindows[id].classList.remove('minimized');
                }
                return;
            }

            const win = document.createElement('div');
            win.className = 'window glass-panel';
            win.id = `win-${id}`;
            win.style.width = width + 'px';
            win.style.height = height + 'px';
            win.style.top = Math.max(40, 60 + (Object.keys(openWindows).length * 25)) + 'px';
            win.style.left = Math.max(40, 80 + (Object.keys(openWindows).length * 25)) + 'px';
            win.style.zIndex = ++zIndexCounter;

            win.innerHTML = `
                <div class="window-header" onmousedown="startDragWindow(event, '${id}')">
                    <div class="flex items-center gap-2 text-xs font-semibold text-gray-200">
                        <span>${icon}</span>
                        <span>${title}</span>
                    </div>
                    <div class="flex items-center gap-1.5" onmousedown="event.stopPropagation()">
                        <button onclick="minimizeWindow('${id}')" class="w-3 h-3 rounded-full bg-amber-500/80 hover:bg-amber-400 transition"></button>
                        <button onclick="maximizeWindow('${id}')" class="w-3 h-3 rounded-full bg-emerald-500/80 hover:bg-emerald-400 transition"></button>
                        <button onclick="closeWindow('${id}')" class="w-3 h-3 rounded-full bg-rose-500/80 hover:bg-rose-400 transition"></button>
                    </div>
                </div>
                <div class="window-body">${contentHTML}</div>
            `;

            win.onmousedown = () => bringToFront(id);
            document.body.appendChild(win);
            openWindows[id] = win;

            updateTaskbar();
        }

        function closeWindow(id) {
            if (openWindows[id]) {
                openWindows[id].remove();
                delete openWindows[id];
                updateTaskbar();
            }
        }

        function minimizeWindow(id) {
            if (openWindows[id]) {
                openWindows[id].classList.toggle('minimized');
                updateTaskbar();
            }
        }

        function maximizeWindow(id) {
            const win = openWindows[id];
            if (!win) return;
            if (!win.dataset.maximized) {
                win.dataset.prevStyle = win.style.cssText;
                win.style.top = '0px';
                win.style.left = '0px';
                win.style.width = '100vw';
                win.style.height = 'calc(100vh - 54px)';
                win.style.borderRadius = '0';
                win.dataset.maximized = 'true';
            } else {
                win.style.cssText = win.dataset.prevStyle;
                delete win.dataset.maximized;
            }
        }

        function bringToFront(id) {
            if (openWindows[id]) {
                openWindows[id].style.zIndex = ++zIndexCounter;
            }
        }

        function startDragWindow(e, id) {
            const win = openWindows[id];
            if (!win || win.dataset.maximized) return;
            let startX = e.clientX - win.offsetLeft;
            let startY = e.clientY - win.offsetTop;

            function doDrag(ev) {
                win.style.left = Math.max(0, ev.clientX - startX) + 'px';
                win.style.top = Math.max(0, ev.clientY - startY) + 'px';
            }

            function stopDrag() {
                window.removeEventListener('mousemove', doDrag);
                window.removeEventListener('mouseup', stopDrag);
            }

            window.addEventListener('mousemove', doDrag);
            window.addEventListener('mouseup', stopDrag);
        }

        function updateTaskbar() {
            const container = document.getElementById('taskbar-apps');
            container.innerHTML = '';
            Object.keys(openWindows).forEach(id => {
                const win = openWindows[id];
                const title = win.querySelector('.window-header span:nth-child(2)').innerText;
                const icon = win.querySelector('.window-header span:nth-child(1)').innerText;
                const isMin = win.classList.contains('minimized');

                const btn = document.createElement('button');
                btn.className = `flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium border transition ${
                    isMin 
                    ? 'bg-white/5 border-white/10 text-gray-400 hover:bg-white/10' 
                    : 'bg-white/15 border-purple-500/40 text-white shadow-[0_0_10px_rgba(168,85,247,0.2)]'
                }`;
                btn.innerHTML = `<span>${icon}</span><span class="max-w-[100px] truncate">${title}</span>`;
                btn.onclick = () => {
                    if (isMin) {
                        win.classList.remove('minimized');
                        bringToFront(id);
                    } else {
                        minimizeWindow(id);
                    }
                };
                container.appendChild(btn);
            });
        }

        /* ==========================================================================
           5. APPS SYSTEM REGISTER & START MENU
           ========================================================================== */
        const appsRegistry = [
            { id: 'browser', name: 'Cosmic Browser', icon: '🌐', launch: openBrowserApp },
            { id: 'explorer', name: 'File Explorer', icon: '📁', launch: openExplorerApp },
            { id: 'discord', name: 'CosmicCord P2P', icon: '🪐', launch: openDiscordApp },
            { id: 'uploader', name: 'App Uploader', icon: '📦', launch: openUploaderApp },
            { id: 'notes', name: 'Notes Editor', icon: '📝', launch: openNotesApp },
            { id: 'terminal', name: 'Cosmic Terminal', icon: '💻', launch: openTerminalApp },
            { id: 'calculator', name: 'Calculator', icon: '🧮', launch: openCalculatorApp },
            { id: 'paint', name: 'Cosmic Paint', icon: '🎨', launch: openPaintApp },
            { id: 'settings', name: 'System Settings', icon: '⚙️', launch: openSettingsApp }
        ];

        let uploadedApps = JSON.parse(localStorage.getItem('cosmic_uploaded_apps') || '[]');

        function renderDesktop() {
            const desktop = document.getElementById('desktop');
            desktop.innerHTML = '';

            // Render Core Built-in System Apps
            appsRegistry.forEach(app => {
                const el = document.createElement('div');
                el.className = 'desktop-icon';
                el.innerHTML = `<div class="icon-img">${app.icon}</div><div class="icon-label">${app.name}</div>`;
                el.ondblclick = app.launch;
                desktop.appendChild(el);
            });

            // Render Uploaded User Custom Apps
            uploadedApps.forEach((uApp, idx) => {
                const el = document.createElement('div');
                el.className = 'desktop-icon';
                el.innerHTML = `<div class="icon-img">${uApp.icon || '🚀'}</div><div class="icon-label">${uApp.name}</div>`;
                el.ondblclick = () => launchUploadedApp(idx);
                desktop.appendChild(el);
            });
        }

        function renderStartMenu() {
            const list = document.getElementById('start-app-list');
            list.innerHTML = '';
            appsRegistry.forEach(app => {
                const item = document.createElement('div');
                item.className = 'flex items-center gap-3 p-2 hover:bg-white/10 rounded-xl cursor-pointer text-xs transition';
                item.innerHTML = `<span class="text-lg">${app.icon}</span><span>${app.name}</span>`;
                item.onclick = () => { app.launch(); toggleStartMenu(); };
                list.appendChild(item);
            });
        }

        function toggleStartMenu() {
            const sm = document.getElementById('start-menu');
            sm.style.display = (sm.style.display === 'flex') ? 'none' : 'flex';
        }

        // Close start menu when clicking on desktop
        document.getElementById('desktop').addEventListener('click', () => {
            document.getElementById('start-menu').style.display = 'none';
        });

        /* ==========================================================================
           6. BUILT-IN APP 1: COSMIC BROWSER (MULTI-TAB + SIMULATED PROXY ENGINE)
           ========================================================================== */
        let browserTabs = [];
        let activeTabId = null;
        let tabCounter = 0;

        function openBrowserApp() {
            createWindow({
                id: 'browser',
                title: 'Cosmic Browser',
                icon: '🌐',
                width: 860,
                height: 560,
                contentHTML: `
                    <div class="flex flex-col h-full bg-slate-950">
                        <div class="flex items-center bg-black/40 px-2 pt-2 gap-1 border-b border-white/10 overflow-x-auto" id="browser-tabs-bar">
                            <button onclick="addBrowserTab()" class="px-2.5 py-1 text-sm text-gray-300 hover:bg-white/10 rounded-md mb-1 transition">+</button>
                        </div>
                        <div class="flex items-center gap-2 p-2 bg-slate-900/80 border-b border-white/10">
                            <button onclick="navBrowser('back')" class="p-1 px-2 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-gray-300">◀</button>
                            <button onclick="navBrowser('forward')" class="p-1 px-2 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-gray-300">▶</button>
                            <button onclick="navBrowser('refresh')" class="p-1 px-2 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-gray-300">🔄</button>
                            <input type="text" id="browser-url-bar" onkeydown="if(event.key==='Enter') navigateBrowserUrl()" class="flex-1 bg-black/50 border border-white/15 rounded-lg px-3 py-1 text-xs text-white focus:outline-none focus:border-purple-500" placeholder="Search or enter URL..." />

        function addBrowserTab(url = 'cosmic://search', title = 'Cosmic Engine') {
            const id = 'tab_' + (++tabCounter);
            browserTabs.push({ id, url, title, history: [url], histIdx: 0 });
            activeTabId = id;
            renderBrowserTabs();
            loadTabContent(id, url);
        }

        function closeBrowserTab(tabId, e) {
            e.stopPropagation();
            browserTabs = browserTabs.filter(t => t.id !== tabId);
            if (browserTabs.length > 0) {
                activeTabId = browserTabs[browserTabs.length - 1].id;
            } else {
                addBrowserTab();
            }
            renderBrowserTabs();
        }

        function switchBrowserTab(tabId) {
            activeTabId = tabId;
            renderBrowserTabs();
            const tab = browserTabs.find(t => t.id === tabId);
            if (tab) {
                document.getElementById('browser-url-bar').value = tab.url;
                const vp = document.getElementById('browser-viewport');
                Array.from(vp.children).forEach(child => {
                    child.style.display = (child.id === `view_${tabId}`) ? 'block' : 'none';
                });
            }
        }

        function renderBrowserTabs() {
            const bar = document.getElementById('browser-tabs-bar');
            if (!bar) return;
            bar.innerHTML = '';
            browserTabs.forEach(t => {
                const btn = document.createElement('div');
                btn.className = `tab-btn ${t.id === activeTabId ? 'active' : ''}`;
                btn.onclick = () => switchBrowserTab(t.id);
                btn.innerHTML = `
                    <span class="truncate">${t.title}</span>
                    <span onclick="closeBrowserTab('${t.id}', event)" class="hover:bg-white/20 rounded-full px-1 text-[10px]">✕</span>
                `;
                bar.appendChild(btn);
            });
            const addBtn = document.createElement('button');
            addBtn.className = 'px-2.5 py-1 text-sm text-gray-300 hover:bg-white/10 rounded-md mb-1 transition';
            addBtn.innerText = '+';
            addBtn.onclick = () => addBrowserTab();
            bar.appendChild(addBtn);
        }

        function loadTabContent(tabId, url) {
            const vp = document.getElementById('browser-viewport');
            if (!vp) return;

            let view = document.getElementById(`view_${tabId}`);
            if (!view) {
                view = document.createElement('div');
                view.id = `view_${tabId}`;
                view.className = 'w-full h-full absolute inset-0 bg-slate-900 text-white';
                vp.appendChild(view);
            }

            Array.from(vp.children).forEach(c => c.style.display = 'none');
            view.style.display = 'block';

            const tab = browserTabs.find(t => t.id === tabId);
            if (tab) {
                tab.url = url;
                document.getElementById('browser-url-bar').value = url;
            }

            // Custom Built-in Search Engine Proxy to Guarantee Content Rendering
            if (url.startsWith('cosmic://search') || url.includes('search?q=')) {
                let query = '';
                if (url.includes('?q=')) query = decodeURIComponent(url.split('?q=')[1]);
                renderCosmicSearchEngine(view, query);
                if (tab) tab.title = query ? `${query} - Cosmic` : 'Cosmic Engine';
            } else {
                // Render Direct iFrame
                view.innerHTML = `<iframe src="${url}" class="w-full h-full border-none" onerror="renderIframeError(this, '${url}')"></iframe>`;
                if (tab) tab.title = url.replace('https://','').split('/')[0];
            }
            renderBrowserTabs();
        }

            const input = document.getElementById('chat-input');
            if (!input || !input.value.trim()) return;

            const msgs = JSON.parse(localStorage.getItem('cosmic_p2p_chat_history') || '[]');
            const newMsg = {
                id: Date.now(),
                author: 'Node-' + Math.floor(Math.random() * 899 + 100),
                text: input.value.trim(),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            msgs.push(newMsg);
            localStorage.setItem('cosmic_p2p_chat_history', JSON.stringify(msgs));
            p2pChannel.postMessage({ type: 'CHAT_MSG' });

            input.value = '';
            renderP2PMessages();
        }

                    <div class="flex flex-col h-full p-2 bg-slate-900 gap-2">
                        <div class="flex items-center gap-3">
                            <input type="color" id="paint-color" value="#a855f7" class="w-8 h-8 rounded bg-transparent cursor-pointer" />
                            <input type="range" id="paint-size" min="1" max="20" value="4" class="w-24" />
                            <button onclick="clearPaintCanvas()" class="px-3 py-1 bg-white/10 hover:bg-white/20 rounded text-xs">Clear</button>
                        </div>
                        <canvas id="paint-cvs" class="flex-1 bg-white rounded-xl cursor-crosshair"></canvas>
                    </div>
                `
            });
            setTimeout(initPaintCanvas, 100);
        }

        function initPaintCanvas() {
            const cvs = document.getElementById('paint-cvs');
            if (!cvs) return;
            const pCtx = cvs.getContext('2d');
            cvs.width = cvs.offsetWidth;
            cvs.height = cvs.offsetHeight;

            let drawing = false;
            cvs.onmousedown = () => drawing = true;
            cvs.onmouseup = () => { drawing = false; pCtx.beginPath(); };
            cvs.onmousemove = (e) => {
                if (!drawing) return;
                const rect = cvs.getBoundingClientRect();
                pCtx.lineWidth = document.getElementById('paint-size').value;
                pCtx.lineCap = 'round';
                pCtx.strokeStyle = document.getElementById('paint-color').value;
                pCtx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                pCtx.stroke();
                pCtx.beginPath();
                pCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            };
        }

        function clearPaintCanvas() {
            const cvs = document.getElementById('paint-cvs');
            if (cvs) cvs.getContext('2d').clearRect(0, 0, cvs.width, cvs.height);
        }

        // Settings
        function openSettingsApp() {
            createWindow({
                id: 'settings',
                title: 'System Settings',
                icon: '⚙️',
                width: 520,
                height: 380,
                contentHTML: `
                    <div class="p-6 text-xs flex flex-col gap-4">
                        <div class="text-sm font-semibold text-purple-400">System Preferences</div>
                        <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl">
                            <span>Clear VFS Storage</span>
                            <button onclick="localStorage.removeItem('cosmic_vfs'); location.reload();" class="px-3 py-1 bg-red-500/80 hover:bg-red-500 rounded">Reset</button>
                        </div>
                        <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl">
                            <span>Reset P2P Access Nodes</span>
                            <button onclick="localStorage.removeItem('cosmic_p2p_primary_node'); location.reload();" class="px-3 py-1 bg-purple-600 hover:bg-purple-500 rounded">Reset Node</button>
                        </div>
                    </div>
                `
            });
        }

        /* ==========================================================================
           11. INITIALIZATION
           ========================================================================== */
        renderDesktop();
        renderStartMenu();
    </script>
</body>
</html>
